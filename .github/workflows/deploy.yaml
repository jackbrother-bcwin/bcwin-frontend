name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy to Deployment Path
        run: |
          mkdir -p /root/bcwin/frontend
          rsync -avz --exclude '.git' --exclude 'node_modules' --exclude '.next' ./ /root/bcwin/frontend/

      # BACKEND_URL → Next rewrites /api/v1/* (server-side)
      # NEXT_PUBLIC_WS_URL → browser WebSocket (path is /api/v1/ws, not /ws)
      - name: Build Frontend Image
        run: |
          docker build -t bcwin-frontend:latest \
            --build-arg BACKEND_URL=https://api.bcwin.club \
            --build-arg NEXT_PUBLIC_WS_URL=wss://api.bcwin.club/api/v1/ws \
            /root/bcwin/frontend

      - name: Deploy Frontend Service
        run: |
          cd /root/bcwin/backend
          docker compose up -d frontend
